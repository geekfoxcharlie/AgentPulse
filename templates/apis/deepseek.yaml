schemaVersion: 1
kind: api-template
id: deepseek
name: DeepSeek
group: llm
description: Official DeepSeek chat API. Default model is deepseek-flash (DeepSeek-V4.1-Flash).
enabled: true
service:
  baseUrl: https://api.deepseek.com
  docsUrl: https://api-docs.deepseek.com/quick_start/pricing
credential:
  type: environment
  defaultName: DEEPSEEK_API_KEY
  placement:
    type: bearer
probe:
  method: GET
  url: https://api.deepseek.com/models
  expectedStatus: [200]
  assertions:
    - path: data
      exists: true
  timeoutMs: 10000
usage:
  notes: >-
    Default model is deepseek-flash (DeepSeek-V4.1-Flash). Chat completions are
    OpenAI-compatible at POST /chat/completions. Retired names deepseek-v4-flash
    and deepseek-v4-flash-vision-exp still route here; prefer deepseek-flash.
    The health probe lists models and does not generate text.
  example: |
    curl -s https://api.deepseek.com/chat/completions \
      -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
      -H "Content-Type: application/json" \
      -d '{"model":"deepseek-flash","messages":[{"role":"user","content":"ping"}],"max_tokens":16,"thinking":{"type":"disabled"}}'
