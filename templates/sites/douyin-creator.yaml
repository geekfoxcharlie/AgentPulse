schemaVersion: 1
kind: site-template
id: douyin-creator
name: Douyin Creator Center
group: sites
description: Douyin creator dashboard for the user's own account data.
enabled: true
url: https://creator.douyin.com
docsUrl: https://creator.douyin.com
login:
  required: true
  check: After load, if a Douyin/ByteDance login or QR-code wall is shown, the user is not logged in.
  loginUrl: https://creator.douyin.com
usage:
  notes: |
    Open with browser-harness against the user's real Chrome profile, not a cloud browser. Login is required. If the page shows a login wall, stop and ask the user to log in; do not enter a password. Use only for the user's own Douyin creator data.
  example: |
    browser-harness <<'PY'
    ensure_real_tab()
    new_tab("https://creator.douyin.com")
    wait_for_load()
    print(page_info())
    PY
